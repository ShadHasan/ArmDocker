<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Orders</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f9;">

    <!-- Header -->
    <header style="background-color: #333; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="header-basket-btn" style="background: none; border: none; color: white; cursor: pointer; font-size: 18px;">🛒 Basket</button>
            <div style="position: relative;">
                <button id="header-user-menu-btn" style="background: none; border: none; color: white; cursor: pointer; font-size: 18px;">👤 User</button>
                <div id="header-user-dropdown" style="display: none; position: absolute; top: 30px; left: 0; background: white; color: black; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.2); width: 120px; z-index: 100;">
                    <div id="dropdown-opt-orders" style="padding: 10px; cursor: pointer; border-bottom: 1px solid #eee;">Orders</div>
                    <div id="dropdown-opt-logout" style="padding: 10px; cursor: pointer;">Logout</div>
                </div>
            </div>
        </div>
        <div>
            <img src="https://via.placeholder.com/30x90?text=Logo" alt="Logo" style="width: 30px; height: 90px; object-fit: cover;">
        </div>
    </header>

    <div style="max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 5px;">
        <h2>Order History</h2>
        
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="order-list-row" data-id="ORD-847291" style="display: flex; justify-content: space-between; padding: 15px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: #fff;">
                <span><strong>Order ID:</strong> ORD-847291</span>
                <span><strong>Status:</strong> <span style="color: #27ae60;">Shipped</span></span>
            </div>
            <div class="order-list-row" data-id="ORD-102938" style="display: flex; justify-content: space-between; padding: 15px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: #fff;">
                <span><strong>Order ID:</strong> ORD-102938</span>
                <span><strong>Status:</strong> <span style="color: #2980b9;">Processing</span></span>
            </div>
            <div class="order-list-row" data-id="ORD-554433" style="display: flex; justify-content: space-between; padding: 15px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: #fff;">
                <span><strong>Order ID:</strong> ORD-554433</span>
                <span><strong>Status:</strong> <span style="color: #7f8c8d;">Completed</span></span>
            </div>
            <div class="order-list-row" data-id="ORD-998877" style="display: flex; justify-content: space-between; padding: 15px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: #fff;">
                <span><strong>Order ID:</strong> ORD-998877</span>
                <span><strong>Status:</strong> <span style="color: #c0392b;">Cancelled</span></span>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer style="background: #333; color: white; text-align: center; padding: 15px; margin-top: 40px;">
        blah blah copyright message
    </footer>

    <script src="script.js"></script>
</body>
</html>
